<!-- SIGNPOST STUB. The policy now lives at ../help/#privacy, alongside support.

     This file exists rather than being deleted because there is no portable
     server-side redirect here: the site is plain static files and the README
     deliberately assumes no particular host (GitHub Pages has no _redirects,
     Netlify's syntax isn't Cloudflare's). A 700-byte page that works everywhere
     beats a 301 that works on one host.

     Keep it until you are certain no submitted build or App Store Connect draft
     still carries this URL. A dead link in a metadata field costs a rejection
     cycle; this file costs nothing.

     The refresh delay is 0 on purpose — a *timed* meta refresh is a WCAG 2.2.1
     failure, an instant one is exempt. The visible link below covers browsers
     and extensions that block meta refresh entirely. noindex keeps this stub
     from competing with the real page in search results. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://brycehart.dev/agil/help/">
<meta http-equiv="refresh" content="0; url=../help/#privacy">

<link rel="icon" href="../../assets/agil/agil-icon-64.png" type="image/png">
<link rel="stylesheet" href="../agil.css">
</head>

<main id="main" class="wrap wrap--narrow" style="padding-block: var(--sp-16);">

    Agil's privacy policy has moved &mdash; it now sits with the support page. If
    you aren't taken there automatically,
    <a class="link" href="../help/#privacy">open it here</a>.
  </p>
</main>
</body>
</html>
